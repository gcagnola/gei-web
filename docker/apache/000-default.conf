<VirtualHost *:80>
    ServerName gei.local

    DocumentRoot /var/www/html/public

    <Directory /var/www/html/public>
        Options Indexes FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/gei-error.log
    CustomLog ${APACHE_LOG_DIR}/gei-access.log combined
</VirtualHost>
